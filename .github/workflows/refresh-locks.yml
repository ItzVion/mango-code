name: Refresh lockfiles

on:
  push:
    branches: [main]
    paths:
      - 'client/package.json'
      - 'server/package.json'
      - '.github/workflows/refresh-locks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Refresh client lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfiles
        run: |
          if git diff --quiet -- client/package-lock.json server/package-lock.json; then
            echo 'Lockfiles already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/package-lock.json server/package-lock.json
          git commit -m 'chore(security): synchronize npm lockfiles [skip ci]'
          git push
